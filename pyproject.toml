[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notio"
version = "0.1.1"
description = "Lightweight project-agnostic CLI for templated notes and log indexes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Arash Shahidi", email = "A.Shahidi@campus.lmu.de" }
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pyyaml>=6.0",
]
keywords = ["notes", "markdown", "cli", "templates", "logs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Groupware",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/arashshahidi1997/notio"
Documentation = "https://arashshahidi1997.github.io/notio/"
Repository = "https://github.com/arashshahidi1997/notio"
Issues = "https://github.com/arashshahidi1997/notio/issues"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
mcp = [
  "fastmcp",
]
dev = [
  "pytest",
  "build",
  "twine",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
notio = "notio.cli:main"
notio-mcp = "notio.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notio = ["templates/default/*.md"]
